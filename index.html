<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok Downloader</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: radial-gradient(circle at top left, #0a0a1a 0%, #000010 40%, #020b16 100%);
      color: #e0e8ff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: 
        radial-gradient(circle at 20% 30%, rgba(0, 255, 255, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(0, 128, 255, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 40% 80%, rgba(0, 255, 200, 0.1) 0%, transparent 50%);
      filter: blur(40px);
      z-index: -1;
    }

    .container {
      background: rgba(10, 15, 30, 0.85);
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 8px 32px rgba(0, 255, 255, 0.15);
      border: 1px solid rgba(0, 255, 255, 0.1);
      backdrop-filter: blur(15px);
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header h1 {
      font-size: 2.5rem;
      background: linear-gradient(45deg, #00ffff, #007bff, #00ccff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
      animation: glow 2s ease-in-out infinite alternate;
    }

    @keyframes glow {
      from {
        text-shadow: 0 0 10px rgba(0, 255, 255, 0.4),
                     0 0 20px rgba(0, 128, 255, 0.3);
      }
      to {
        text-shadow: 0 0 20px rgba(0, 255, 255, 0.7),
                     0 0 35px rgba(0, 128, 255, 0.5);
      }
    }

    .copyright {
      color: rgba(180, 220, 255, 0.9);
      font-size: 0.9rem;
      margin-top: 5px;
      text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
    }

    .input-group {
      margin-bottom: 25px;
    }

    .input-group label {
      display: block;
      margin-bottom: 8px;
      color: #cce7ff;
      font-weight: 500;
      text-shadow: 0 0 8px rgba(0, 255, 255, 0.3);
    }

    .url-input {
      width: 100%;
      padding: 15px 20px;
      border-radius: 12px;
      border: 1px solid rgba(0, 255, 255, 0.2);
      background: rgba(0, 20, 40, 0.6);
      color: #e0f7ff;
      font-size: 1rem;
      transition: all 0.3s ease;
    }

    .url-input::placeholder {
      color: rgba(200, 230, 255, 0.5);
    }

    .url-input:focus {
      outline: none;
      background: rgba(0, 40, 60, 0.7);
      box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
      border-color: rgba(0, 255, 255, 0.4);
    }

    .download-btn {
      width: 100%;
      padding: 16px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      background: linear-gradient(45deg, #00ccff, #007bff);
      color: white;
      font-size: 1.1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 200, 255, 0.4);
      transition: all 0.3s ease;
    }

    .download-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
      transition: 0.5s;
    }

    .download-btn:hover::before {
      left: 100%;
    }

    .download-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0, 255, 255, 0.6);
    }

    .loading {
      display: none;
      text-align: center;
      margin: 20px 0;
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(0, 255, 255, 0.15);
      border-left: 4px solid #00ffff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto;
      box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .result {
      display: none;
      margin-top: 30px;
      background: rgba(0, 20, 40, 0.7);
      border-radius: 15px;
      padding: 25px;
      border: 1px solid rgba(0, 255, 255, 0.1);
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
    }

    .video-info {
      text-align: center;
      margin-bottom: 20px;
    }

    .video-thumb {
      width: 100%;
      max-width: 300px;
      border-radius: 12px;
      margin: 0 auto 15px;
      display: block;
      border: 2px solid rgba(0, 255, 255, 0.2);
      box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
    }

    .video-title {
      font-size: 1.1rem;
      color: #e0f7ff;
      text-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
    }

    .download-options {
      display: grid;
      gap: 12px;
    }

    .option-btn {
      padding: 12px 20px;
      border-radius: 10px;
      text-decoration: none;
      color: white;
      font-weight: 500;
      text-align: center;
      transition: all 0.3s ease;
      box-shadow: 0 0 10px rgba(0, 255, 255, 0.2);
    }

    .option-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
    }

    .hd-btn {
      background: linear-gradient(45deg, #00bfff, #007bff);
    }

    .sd-btn {
      background: linear-gradient(45deg, #0088cc, #00ccff);
    }

    .mp3-btn {
      background: linear-gradient(45deg, #00ffaa, #00cc99);
    }

    @media (max-width: 600px) {
      .container { padding: 30px 20px; }
      .header h1 { font-size: 2rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>TikTok Downloader</h1>
      <div class="copyright">© 2025 TEDDY TECH</div>
    </div>

    <div class="input-group">
      <label for="url">URL TikTok</label>
      <input id="url" class="url-input" type="text" placeholder="Paste the TikTok URL">
    </div>

    <button id="btn" class="download-btn" onclick="dl()">
      <i class="fas fa-download"></i> Downloader
    </button>

    <div id="loading" class="loading">
      <div class="loading-spinner"></div>
      <p>Uploading videos...</p>
    </div>

    <div id="result" class="result">
      <div class="video-info">
        <img id="thumb" class="video-thumb" src="" alt="Video Thumbnail">
        <p id="title" class="video-title"></p>
      </div>
      <div class="download-options">
        <a id="hd" href="#" class="option-btn hd-btn" target="_blank">Download HD</a>
        <a id="sd" href="#" class="option-btn sd-btn" target="_blank">Download SD</a>
        <a id="mp3" href="#" class="option-btn mp3-btn" target="_blank">Download MP3</a>
      </div>
    </div>
  </div>

  <script>
    async function dl() {
      const url = document.getElementById('url').value.trim();
      if (!url) return alert('Enter the TikTok link!');

      const btn = document.getElementById('btn');
      const loading = document.getElementById('loading');
      const result = document.getElementById('result');

      btn.disabled = true;
      loading.style.display = 'block';
      result.style.display = 'none';

      try {
        const api = `https://api.nvidiabotz.xyz/download/tiktok?url=${encodeURIComponent(url)}`;
        const res = await fetch(api);
        const json = await res.json();

        if (!json.status) throw new Error(json.message || 'Fail');

        const { video_hd, video_sd, mp3, thumbnail, title } = json.result;

        document.getElementById('thumb').src = thumbnail;
        document.getElementById('title').textContent = title;
        document.getElementById('hd').href = video_hd;
        document.getElementById('sd').href = video_sd;
        document.getElementById('mp3').href = mp3;
        result.style.display = 'block';
      } catch (e) {
        alert(e.message || 'Server error');
      } finally {
        btn.disabled = false;
        loading.style.display = 'none';
      }
    }

    document.getElementById('url').addEventListener('keypress', e => {
      if (e.key === 'Enter') dl();
    });
  </script>
</body>
</html>
